pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Release/version source of truth for this repo.
// Bump this for each release and keep gradle.properties:mod_version in sync.
ext.release_version = '1.1.0'

// Ensure all projects can reference the release version.
gradle.beforeProject { p ->
    p.ext.release_version = settings.ext.release_version
}
