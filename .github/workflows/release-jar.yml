name: Release Jar

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  release-jar:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '25'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build jar
        run: ./gradlew clean buildModJar

      - name: Read release metadata
        id: meta
        shell: bash
        run: |
          echo "mod_id=$(grep '^mod_id=' gradle.properties | cut -d'=' -f2-)" >> "$GITHUB_OUTPUT"
          echo "release_version=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2-)" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2-)" >> "$GITHUB_OUTPUT"
          echo "neo_version=$(grep '^neo_version=' gradle.properties | cut -d'=' -f2-)" >> "$GITHUB_OUTPUT"

      - name: Upload jar to GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'master-snapshot' }}
          name: ${{ github.event_name == 'pull_request' && format('PR {0} Build', github.event.pull_request.number) || format('Master Snapshot ({0})', github.sha) }}
          prerelease: true
          make_latest: false
          files: build/jar/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload jar artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: auxilio-jar
          path: build/jar/*.jar

      - name: Upload jar to CurseForge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CF_API_KEY }}
          project_id: ${{ vars.CF_PROJECT_ID }}
          game_endpoint: minecraft
          file_path: build/jar/${{ steps.meta.outputs.mod_id }}-${{ steps.meta.outputs.release_version }}.jar
          release_type: release
          game_versions: Minecraft ${{ steps.meta.outputs.minecraft_version }}:${{ steps.meta.outputs.minecraft_version }},Java ${{ env.JAVA_VERSION }},NeoForge ${{ steps.meta.outputs.neo_version }}
