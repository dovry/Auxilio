name: Build And Publish Jar (mc-publish)

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
      - '**.gif'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '25'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build jar
        run: ./gradlew clean buildModJar

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: auxilio-jar
          path: build/jar/*.jar

  release-jar:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    env:
      JAVA_VERSION: '25'
      CF_PROJECT_ID: '1543992'
      MODRINTH_PROJECT_ID: 'tpPRqoyR'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read release metadata
        id: meta
        shell: bash
        run: |
          echo "mod_id=$(grep '^mod_id=' gradle.properties | cut -d'=' -f2-)" >> "$GITHUB_OUTPUT"
          echo "release_version=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2-)" >> "$GITHUB_OUTPUT"
          MC_VERSION="$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2-)"
          echo "minecraft_version=${MC_VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$MC_VERSION" == *.* ]]; then
            echo "cf_minecraft_series=${MC_VERSION%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "cf_minecraft_series=${MC_VERSION}" >> "$GITHUB_OUTPUT"
          fi
          echo "cf_minecraft_version=${MC_VERSION}" >> "$GITHUB_OUTPUT"
          NEO_VERSION="$(grep '^neo_version=' gradle.properties | cut -d'=' -f2-)"
          echo "neo_version=${NEO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "dist_jar_name=$(grep '^mod_id=' gradle.properties | cut -d'=' -f2-)-${MC_VERSION}-${NEO_VERSION}.jar" >> "$GITHUB_OUTPUT"

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: auxilio-jar
          path: build/jar

      - name: Build CHANGELOG.md
        shell: bash
        run: |
          RELEASE_VERSION="${{ steps.meta.outputs.release_version }}"
          MINECRAFT_VERSION="${{ steps.meta.outputs.minecraft_version }}"
          NEO_VERSION="${{ steps.meta.outputs.neo_version }}"
          REPO="${{ github.repository }}"

          PREV_TAG="$(git tag --sort=-v:refname | grep -v "^${RELEASE_VERSION}$" | head -n1 || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          {
            echo "# ${RELEASE_VERSION}"
            echo
            echo "## Versions"
            echo "- Mod: ${RELEASE_VERSION}"
            echo "- Minecraft: ${MINECRAFT_VERSION}"
            echo "- NeoForge: ${NEO_VERSION}"
            echo
            echo "## Changelog"
            if [ "$RANGE" = "HEAD" ]; then
              git log -n 30 --pretty='- %s (%h)'
            else
              git log "$RANGE" --pretty='- %s (%h)'
            fi
            echo
            echo "## Pull Requests"
            PRS="$(git log ${RANGE} --pretty='%s%n%b' | grep -oE '#[0-9]+' | sort -u || true)"
            if [ -n "$PRS" ]; then
              while IFS= read -r pr; do
                num="${pr#\#}"
                echo "- [#${num}](https://github.com/${REPO}/pull/${num})"
              done <<< "$PRS"
            else
              echo "- None referenced in commit messages."
            fi
            echo
            echo "## README"
            cat README.md
          } > CHANGELOG.md

      - name: Publish to GitHub, CurseForge, and Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: build/jar/${{ steps.meta.outputs.dist_jar_name }}
          changelog-file: CHANGELOG.md

          github-tag: ${{ steps.meta.outputs.release_version }}
          name: ${{ steps.meta.outputs.release_version }}
          version: ${{ steps.meta.outputs.release_version }}
          version-type: release
          github-token: ${{ secrets.GITHUB_TOKEN }}

          curseforge-id: ${{ env.CF_PROJECT_ID }}
          curseforge-token: ${{ secrets.CF_API_KEY }}

          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
